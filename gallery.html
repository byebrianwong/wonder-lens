<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Character Gallery</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0e14; overflow: hidden; font: 13px/1.4 system-ui, sans-serif; color: #e8e8e8; }
      #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #bar { position: fixed; left: 8px; top: 8px; display: flex; flex-wrap: wrap; gap: 4px; max-width: calc(100% - 16px); }
      #bar button { background: rgba(10, 14, 20, 0.7); color: inherit; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 4px; padding: 3px 7px; cursor: pointer; }
      #bar button.on { background: #7fc7a4; color: #0b0e14; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="bar"></div>
    <script type="module" src="/src/dev/gallery.ts"></script>
  </body>
</html>
